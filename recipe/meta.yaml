{% set name = "pyclesperanto-prototype" %}
{% set version = "0.24.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pyclesperanto_prototype-{{ version }}.tar.gz
  sha256: 07e292867df39cd809e46e6ca033494e437c0f6f012a56540a765f649c056ead

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - matplotlib-base
    - numpy !=1.19.4
    - platformdirs
    - pyopencl
    - python >={{ python_min }}
    - scikit-image >=0.18.0, !=0.20.0
    - toolz
    - transforms3d

test:
  imports:
    - pyclesperanto_prototype
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - pocl  # [not win]
    - oclgrind  # [win]
    - python {{ python_min }}

about:
  home: https://github.com/clEsperanto/pyclesperanto_prototype
  summary: GPU-accelerated image processing in python using OpenCL
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - goanpeca
    - haesleinhuepf
